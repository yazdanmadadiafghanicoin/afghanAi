<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yazdan AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: #0b0f14;
    }

    header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      border-bottom: 1px solid #202731;
      background: #11161d;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      font-size: 20px;
      font-weight: bold;
    }

    .brand-text strong {
      display: block;
      font-size: 16px;
    }

    .brand-text span {
      display: block;
      color: #8d98a8;
      font-size: 11px;
      margin-top: 3px;
    }

    .clear-btn {
      border: 0;
      background: #1b222c;
      color: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .clear-btn:active {
      transform: scale(.96);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 15px 120px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin-top: 60px;
      color: #aab4c2;
    }

    .welcome-icon {
      width: 70px;
      height: 70px;
      margin: auto;
      border-radius: 22px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      color: white;
      margin: 8px 0;
    }

    .welcome p {
      font-size: 13px;
      line-height: 1.8;
    }

    .message {
      display: flex;
      margin: 12px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 17px;
      line-height: 1.8;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #2563eb;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #1b222c;
      border: 1px solid #29313c;
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: none;
      color: #8d98a8;
      font-size: 12px;
      padding: 5px 15px 10px;
    }

    .typing.active {
      display: block;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100%);
      padding: 10px 12px 14px;
      background: linear-gradient(
        transparent,
        #0b0f14 20%
      );
    }

    .input-box {
      display: flex;
      gap: 8px;
      background: #151b23;
      border: 1px solid #2a333f;
      border-radius: 16px;
      padding: 7px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 14px;
      padding: 9px;
      min-height: 42px;
      max-height: 110px;
    }

    textarea::placeholder {
      color: #788493;
    }

    .send {
      width: 45px;
      height: 45px;
      border: 0;
      border-radius: 13px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .send:disabled {
      opacity: .5;
    }

    @media (max-width: 500px) {
      .bubble {
        max-width: 90%;
      }

      #chat {
        padding-left: 10px;
        padding-right: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="logo">Y</div>

      <div class="brand-text">
        <strong>Yazdan AI</strong>
        <span>دستیار هوش مصنوعی</span>
      </div>
    </div>

    <button class="clear-btn" onclick="clearHistory()">
      پاک کردن
    </button>
  </header>

  <main id="chat"></main>

  <div class="typing" id="typing">
    Yazdan AI در حال فکر کردن است...
  </div>

  <div class="bottom">
    <div class="input-box">

      <textarea
        id="messageInput"
        placeholder="پیام خود را بنویسید..."
        rows="1"
      ></textarea>

      <button
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>
  </div>

</div>

<script>

const STORAGE_KEY = "yazdan_ai_history_v1";

let messages = loadHistory();

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const typing = document.getElementById("typing");

function loadHistory() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
      return [];
    }

    const data = JSON.parse(saved);

    if (!Array.isArray(data)) {
      return [];
    }

    return data;

  } catch (error) {
    console.error(error);
    return [];
  }
}

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(messages)
    );
  } catch (error) {
    console.error("Could not save history:", error);
  }
}

function escapeHTML(text) {
  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function render() {

  chat.innerHTML = "";

  if (messages.length === 0) {

    chat.innerHTML = `
      <div class="welcome">

        <div class="welcome-icon">
          🤖
        </div>

        <h2>سلام، من Yazdan AI هستم</h2>

        <p>
          هر سوالی داری بنویس.<br>
          می‌توانم در برنامه‌نویسی، GitHub،
          Vercel و موضوعات مختلف کمکت کنم.
        </p>

      </div>
    `;

    return;
  }

  messages.forEach(message => {

    const wrapper = document.createElement("div");

    wrapper.className =
      "message " +
      (message.role === "user"
        ? "user"
        : "assistant");

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.innerHTML =
      escapeHTML(message.content);

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);
  });

  scrollToBottom();
}

function scrollToBottom() {
  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 50);
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) {
    return;
  }

  if (sendButton.disabled) {
    return;
  }

  messages.push({
    role: "user",
    content: text
  });

  saveHistory();
  render();

  input.value = "";
  input.style.height = "auto";

  sendButton.disabled = true;
  typing.classList.add("active");

  scrollToBottom();

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: messages.slice(-20)
      })

    });

    const data = await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error || "خطا در ارتباط با هوش مصنوعی"
      );

    }

    messages.push({
      role: "assistant",
      content: data.reply
    });

    saveHistory();
    render();

  } catch (error) {

    console.error(error);

    messages.push({
      role: "assistant",
      content:
        "❌ خطا در اتصال به هوش مصنوعی.\n\n" +
        "لطفاً دوباره تلاش کنید."
    });

    saveHistory();
    render();

  } finally {

    sendButton.disabled = false;
    typing.classList.remove("active");

    input.focus();
  }
}

function clearHistory() {

  const confirmed = confirm(
    "آیا می‌خواهید تمام تاریخچه گفتگو پاک شود؟"
  );

  if (!confirmed) {
    return;
  }

  messages = [];

  localStorage.removeItem(STORAGE_KEY);

  render();
}

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {

    event.preventDefault();

    sendMessage();
  }

});

input.addEventListener("input", function() {

  this.style.height = "auto";

  this.style.height =
    Math.min(this.scrollHeight, 110) + "px";

});

render();

</script>

</body>
</html>
