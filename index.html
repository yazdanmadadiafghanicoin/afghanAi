<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Yazdan AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #182449 0, transparent 35%),
        linear-gradient(180deg, #080c18, #0d1324);
      color: #fff;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 16px;
      background: rgba(8, 12, 24, .9);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
      background: linear-gradient(135deg, #6d5dfc, #20d5ff);
      box-shadow: 0 8px 30px rgba(32,213,255,.2);
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: #8ee7b0;
    }

    .clear {
      margin-right: auto;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: #fff;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      padding: 20px 14px 130px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      padding: 55px 20px 30px;
      color: #b8c1d9;
    }

    .welcome-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .welcome h2 {
      color: #fff;
      margin: 10px 0;
    }

    .welcome p {
      line-height: 1.9;
      font-size: 14px;
    }

    .message {
      display: flex;
      margin: 12px 0;
      animation: appear .2s ease;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 13px 15px;
      border-radius: 18px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #536dfe, #705cff);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #171e32;
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-left-radius: 5px;
    }

    .typing {
      opacity: .7;
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      padding: 10px 12px 14px;
      background: linear-gradient(
        transparent,
        rgba(8,12,24,.97) 30%
      );
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
      background: #141b2d;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 8px;
      box-shadow: 0 -5px 30px rgba(0,0,0,.25);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
      min-height: 45px;
      max-height: 130px;
      font-family: inherit;
      font-size: 14px;
      direction: rtl;
    }

    textarea::placeholder {
      color: #68728c;
    }

    #send {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #6d5dfc, #20d5ff);
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    #send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .error {
      color: #ff8f8f;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 700px) {
      #chat {
        padding-left: 25px;
        padding-right: 25px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="top">
      <div class="logo">AI</div>

      <div>
        <h1>Yazdan AI</h1>
        <div class="status" id="status">● آماده</div>
      </div>

      <button class="clear" id="clearBtn">پاک‌کردن</button>
    </div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>سلام! من Yazdan AI هستم</h2>
      <p>
        هر سؤالی داری بنویس.<br>
        می‌توانیم از همین‌جا هوش مصنوعی خودت را بسازیم و مرحله‌به‌مرحله توسعه بدهیم.
      </p>
    </div>

  </main>

  <div class="bottom">
    <div class="input-box">

      <textarea
        id="message"
        placeholder="پیام خود را بنویس..."
        rows="1"
      ></textarea>

      <button id="send" title="ارسال">➤</button>

    </div>
  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const textarea = document.getElementById("message");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const clearBtn = document.getElementById("clearBtn");
  const welcome = document.getElementById("welcome");

  let messages = [];

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function addMessage(role, text) {

    if (welcome) {
      welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = escapeHtml(text);

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    return bubble;
  }

  function setStatus(text, color) {
    statusEl.textContent = "● " + text;
    statusEl.style.color = color || "#8ee7b0";
  }

  async function sendMessage() {

    const text = textarea.value.trim();

    if (!text || sendBtn.disabled) {
      return;
    }

    textarea.value = "";
    textarea.style.height = "45px";

    addMessage("user", text);

    messages.push({
      role: "user",
      content: text
    });

    sendBtn.disabled = true;
    textarea.disabled = true;

    setStatus("در حال فکر کردن...", "#ffd166");

    const thinkingBubble = addMessage("ai", "در حال پاسخ دادن...");

    thinkingBubble.classList.add("typing");

    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          messages: messages
        })

      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "خطا در ارتباط با سرور");
      }

      thinkingBubble.classList.remove("typing");

      thinkingBubble.textContent = data.reply || "پاسخی دریافت نشد.";

      messages.push({
        role: "assistant",
        content: data.reply
      });

      setStatus("آماده", "#8ee7b0");

    } catch (error) {

      thinkingBubble.classList.remove("typing");
      thinkingBubble.classList.add("error");

      thinkingBubble.textContent =
        "خطا: " + error.message;

      setStatus("خطا در اتصال", "#ff8f8f");

    } finally {

      sendBtn.disabled = false;
      textarea.disabled = false;
      textarea.focus();

    }
  }

  sendBtn.addEventListener("click", sendMessage);

  textarea.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }

  });

  textarea.addEventListener("input", function() {

    this.style.height = "45px";
    this.style.height =
      Math.min(this.scrollHeight, 130) + "px";

  });

  clearBtn.addEventListener("click", function() {

    messages = [];

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>سلام! من Yazdan AI هستم</h2>
        <p>
          گفتگو پاک شد.<br>
          پیام جدید خود را بنویس.
        </p>
      </div>
    `;

    setStatus("آماده", "#8ee7b0");

  });

  textarea.focus();
</script>

</body>
</html>
