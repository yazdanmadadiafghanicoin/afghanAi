<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>AfghanAI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#17335e 0,#07111f 42%,#030712 100%);
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Tahoma,Arial,sans-serif;
}

button,textarea,select{
  font:inherit;
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(3,7,18,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  box-shadow:0 8px 30px rgba(37,99,235,.35);
  font-size:23px;
}

.title{
  font-size:19px;
  font-weight:800;
}

.subtitle{
  font-size:11px;
  color:#94a3b8;
}

.actions{
  display:flex;
  align-items:center;
  gap:6px;
}

select{
  height:40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#fff;
  padding:0 7px;
  outline:none;
}

select option{
  color:#111;
}

.icon{
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#fff;
  cursor:pointer;
}

.icon.active{
  background:#2563eb;
}

#chat{
  flex:1;
  padding:20px 13px 155px;
  overflow-y:auto;
}

.welcome{
  text-align:center;
  padding:45px 15px 25px;
}

.welcome-icon{
  font-size:55px;
}

.welcome h1{
  margin:10px 0;
  font-size:27px;
}

.welcome p{
  color:#94a3b8;
  line-height:1.8;
  max-width:600px;
  margin:0 auto 25px;
}

.suggestions{
  max-width:650px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.suggestion{
  color:#e2e8f0;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-radius:15px;
  padding:13px;
  cursor:pointer;
  text-align:right;
}

.suggestion:hover{
  background:rgba(255,255,255,.08);
}

.message{
  display:flex;
  margin:13px 0;
}

.message.user{
  justify-content:flex-start;
}

.message.assistant{
  justify-content:flex-end;
}

.wrap{
  max-width:90%;
}

.bubble{
  padding:13px 15px;
  border-radius:18px;
  line-height:1.85;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:15px;
}

.user .bubble{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  border-bottom-left-radius:5px;
}

.assistant .bubble{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  border-bottom-right-radius:5px;
}

.actions-row{
  display:flex;
  gap:5px;
  margin-top:6px;
  flex-wrap:wrap;
}

.small{
  border:0;
  background:rgba(255,255,255,.06);
  color:#94a3b8;
  padding:5px 9px;
  border-radius:9px;
  font-size:12px;
  cursor:pointer;
}

.small:hover{
  color:#fff;
}

.web-results{
  margin-top:10px;
  padding:10px;
  border-radius:14px;
  background:rgba(37,99,235,.08);
  border:1px solid rgba(96,165,250,.14);
}

.web-title{
  font-size:12px;
  color:#60a5fa;
  margin-bottom:7px;
  font-weight:700;
}

.web-item{
  padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.web-item:last-child{
  border-bottom:0;
}

.web-item a{
  color:#bfdbfe;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

.web-item p{
  color:#94a3b8;
  font-size:11px;
  line-height:1.6;
  margin:4px 0 0;
}

.typing{
  display:inline-flex;
  gap:4px;
  padding:13px 15px;
  background:rgba(255,255,255,.07);
  border-radius:17px;
}

.typing span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#94a3b8;
  animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{transform:translateY(0)}
  30%{transform:translateY(-5px)}
}

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,#030712 65%,rgba(3,7,18,.8));
  backdrop-filter:blur(18px);
}

.composer-inner{
  max-width:900px;
  margin:auto;
}

.search-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:7px;
}

.web-toggle{
  height:32px;
  padding:0 11px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#94a3b8;
  cursor:pointer;
  font-size:12px;
}

.web-toggle.active{
  background:#2563eb;
  color:#fff;
}

.search-hint{
  font-size:10px;
  color:#64748b;
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:7px;
}

textarea{
  flex:1;
  min-height:43px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:10px;
  line-height:1.6;
}

textarea::placeholder{
  color:#64748b;
}

.send,
.mic{
  flex:0 0 auto;
  width:43px;
  height:43px;
  border:0;
  border-radius:13px;
  color:#fff;
  cursor:pointer;
}

.send{
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.mic{
  background:rgba(255,255,255,.08);
}

.mic.recording{
  background:#dc2626;
}

.status{
  text-align:center;
  color:#64748b;
  font-size:10px;
  margin-top:6px;
}

@media(max-width:480px){

  .suggestions{
    grid-template-columns:1fr;
  }

  .wrap{
    max-width:94%;
  }

  .title{
    font-size:17px;
  }

  .search-hint{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header">

    <div class="brand">
      <div class="logo">🤖</div>

      <div>
        <div class="title">AfghanAI</div>
        <div class="subtitle" id="subtitle">
          دستیار هوش مصنوعی
        </div>
      </div>
    </div>

    <div class="actions">

      <select id="language">
        <option value="auto">🌐 Auto</option>
        <option value="fa">🇦🇫 فارسی</option>
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="ru">🇷🇺 Русский</option>
        <option value="es">🇪🇸 Español</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="hi">🇮🇳 हिन्दी</option>
      </select>

      <button class="icon" id="clearBtn">🗑️</button>

    </div>

  </div>
</header>

<main id="chat">

  <div class="welcome" id="welcome">

    <div class="welcome-icon">🧠</div>

    <h1 id="welcomeTitle">
      سلام! من AfghanAI هستم
    </h1>

    <p id="welcomeText">
      دستیار هوش مصنوعی شخصی شما با امکان جستجوی اینترنتی.
    </p>

    <div class="suggestions">

      <button class="suggestion"
        data-text="آخرین اخبار مهم بازار ارزهای دیجیتال چیست؟">
        🌐 آخرین اخبار کریپتو
      </button>

      <button class="suggestion"
        data-text="امروز قیمت بیت کوین چقدر است؟">
        ₿ قیمت بیت کوین
      </button>

      <button class="suggestion"
        data-text="جدیدترین اخبار فناوری چیست؟">
        💻 اخبار فناوری
      </button>

      <button class="suggestion"
        data-text="چطور یک سایت حرفه‌ای بسازم؟">
        🛠️ ساخت سایت
      </button>

    </div>

  </div>

</main>

<div class="composer">

  <div class="composer-inner">

    <div class="search-row">

      <button
        class="web-toggle active"
        id="webToggle">
        🌐 جستجوی اینترنت
      </button>

      <span class="search-hint">
        برای سوال‌های جدید و قیمت‌ها روشن باشد
      </span>

    </div>

    <div class="input-box">

      <button class="mic" id="micBtn">
        🎙️
      </button>

      <textarea
        id="input"
        rows="1"
        placeholder="پیام خود را بنویسید..."
      ></textarea>

      <button class="send" id="sendBtn">
        ➤
      </button>

    </div>

    <div class="status" id="status">
      AfghanAI آماده است
    </div>

  </div>

</div>

</div>

<script>
"use strict";

const HISTORY_KEY = "afghanai_history_v6";
const LANGUAGE_KEY = "afghanai_language_v6";

let messages = [];
let selectedLanguage =
  localStorage.getItem(LANGUAGE_KEY) || "auto";

let webSearchEnabled = true;

let recognition = null;
let isRecording = false;

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendBtn =
  document.getElementById("sendBtn");

const micBtn =
  document.getElementById("micBtn");

const clearBtn =
  document.getElementById("clearBtn");

const language =
  document.getElementById("language");

const webToggle =
  document.getElementById("webToggle");

const status =
  document.getElementById("status");

const welcome =
  document.getElementById("welcome");

language.value =
  selectedLanguage;

/* =========================
LANGUAGE
========================= */

function getLanguage(){

  if(selectedLanguage !== "auto"){
    return selectedLanguage;
  }

  const browser =
    navigator.language?.slice(0,2);

  return browser || "fa";
}

function applyLanguage(){

  const lang =
    getLanguage();

  const rtl =
    ["fa","ar"].includes(lang);

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    rtl ? "rtl" : "ltr";

}

applyLanguage();

/* =========================
LOAD HISTORY
========================= */

function loadHistory(){

  try{

    const saved =
      localStorage.getItem(HISTORY_KEY);

    if(!saved) return;

    const data =
      JSON.parse(saved);

    if(!Array.isArray(data)) return;

    messages = data;

    messages.forEach(m => {

      addMessage(
        m.role,
        m.content,
        false,
        m.webResults || []
      );

    });

    if(messages.length){
      welcome.style.display =
        "none";
    }

  }catch(error){

    console.error(error);

  }
}

loadHistory();

/* =========================
SAVE
========================= */

function saveHistory(){

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(
      messages.slice(-100)
    )
  );

}

/* =========================
ESCAPE
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

/* =========================
ADD MESSAGE
========================= */

function addMessage(
  role,
  content,
  scroll=true,
  webResults=[]
){

  const message =
    document.createElement("div");

  message.className =
    "message " + role;

  const wrap =
    document.createElement("div");

  wrap.className =
    "wrap";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.innerHTML =
    escapeHTML(content);

  wrap.appendChild(bubble);

  if(
    role === "assistant" &&
    webResults.length
  ){

    const web =
      document.createElement("div");

    web.className =
      "web-results";

    web.innerHTML =
      `<div class="web-title">
        🌐 منابع اینترنتی
      </div>`;

    webResults
      .slice(0,5)
      .forEach(result => {

        const item =
          document.createElement("div");

        item.className =
          "web-item";

        item.innerHTML = `
          <a href="${escapeHTML(result.url)}"
             target="_blank"
             rel="noopener noreferrer">
             ${escapeHTML(result.title)}
          </a>
          <p>
             ${escapeHTML(result.snippet || "")}
          </p>
        `;

        web.appendChild(item);

      });

    wrap.appendChild(web);

  }

  if(role === "assistant"){

    const actions =
      document.createElement("div");

    actions.className =
      "actions-row";

    const copy =
      document.createElement("button");

    copy.className =
      "small";

    copy.textContent =
      "📋 کپی";

    copy.onclick =
      async () => {

        await navigator.clipboard.writeText(
          content
        );

        copy.textContent =
          "✅ کپی شد";

        setTimeout(
          () => copy.textContent = "📋 کپی",
          1500
        );

      };

    actions.appendChild(copy);

    wrap.appendChild(actions);

  }

  message.appendChild(wrap);

  chat.appendChild(message);

  if(scroll){
    chat.scrollTop =
      chat.scrollHeight;
  }

}

/* =========================
TYPING
========================= */

function showTyping(){

  const el =
    document.createElement("div");

  el.id =
    "typing";

  el.className =
    "message assistant";

  el.innerHTML = `
    <div class="wrap">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  chat.appendChild(el);

  chat.scrollTop =
    chat.scrollHeight;

}

function hideTyping(){

  document
    .getElementById("typing")
    ?.remove();

}

/* =========================
WEB SEARCH
========================= */

async function searchWeb(query){

  try{

    const response =
      await fetch(
        "/api/search?q=" +
        encodeURIComponent(query)
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      console.warn(
        "Search error:",
        data.error
      );

      return [];

    }

    return Array.isArray(data.results)
      ? data.results
      : [];

  }catch(error){

    console.error(
      "Web search error:",
      error
    );

    return [];

  }

}

/* =========================
SEND
========================= */

async function sendMessage(
  forcedText=null
){

  const text =
    String(
      forcedText !== null
        ? forcedText
        : input.value
    ).trim();

  if(!text) return;

  input.value = "";
  input.style.height =
    "auto";

  welcome.style.display =
    "none";

  let webResults = [];

  if(webSearchEnabled){

    status.textContent =
      "🌐 در حال جستجوی اینترنت...";

    webResults =
      await searchWeb(text);

  }

  messages.push({

    role:"user",

    content:text,

    webResults:webResults

  });

  addMessage(
    "user",
    text
  );

  saveHistory();

  showTyping();

  sendBtn.disabled =
    true;

  try{

    let webContext = "";

    if(webResults.length){

      webContext =
        webResults
          .map(
            (r,i) =>
              `[${i+1}] ${r.title}\n` +
              `URL: ${r.url}\n` +
              `متن: ${r.snippet}`
          )
          .join("\n\n");

    }

    const response =
      await fetch(
        "/api/chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              messages.slice(-20),

            language:
              selectedLanguage,

            webContext

          })

        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.error ||
        "خطا در دریافت پاسخ"
      );

    }

    const reply =
      String(data.reply || "").trim();

    if(!reply){

      throw new Error(
        "پاسخ خالی دریافت شد"
      );

    }

    messages.push({

      role:"assistant",

      content:reply,

      webResults

    });

    addMessage(
      "assistant",
      reply,
      true,
      webResults
    );

    saveHistory();

    status.textContent =
      webResults.length
        ? "🌐 پاسخ بر اساس جستجوی اینترنتی"
        : "AfghanAI آماده است";

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "❌ " +
      (
        error.message ||
        "خطا در ارتباط با سرور"
      )
    );

    status.textContent =
      "خطا";

  }finally{

    hideTyping();

    sendBtn.disabled =
      false;

    input.focus();

  }

}

/* =========================
SEND BUTTON
========================= */

sendBtn.onclick =
  () => sendMessage();

/* =========================
ENTER
========================= */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

/* =========================
AUTO RESIZE
========================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);

/* =========================
WEB TOGGLE
========================= */

webToggle.onclick =
  () => {

    webSearchEnabled =
      !webSearchEnabled;

    webToggle.classList.toggle(
      "active",
      webSearchEnabled
    );

    webToggle.textContent =
      webSearchEnabled
        ? "🌐 جستجوی اینترنت"
        : "🔴 جستجو خاموش";

  };

/* =========================
CLEAR
========================= */

clearBtn.onclick =
  () => {

    if(
      !confirm(
        "تمام تاریخچه پاک شود؟"
      )
    ) return;

    messages = [];

    localStorage.removeItem(
      HISTORY_KEY
    );

    document
      .querySelectorAll(
        ".message"
      )
      .forEach(el => el.remove());

    welcome.style.display =
      "block";

    status.textContent =
      "AfghanAI آماده است";

  };

/* =========================
LANGUAGE
========================= */

language.onchange =
  () => {

    selectedLanguage =
      language.value;

    localStorage.setItem(
      LANGUAGE_KEY,
      selectedLanguage
    );

    applyLanguage();

  };

/* =========================
SUGGESTIONS
========================= */

document
  .querySelectorAll(".suggestion")
  .forEach(button => {

    button.onclick =
      () => {

        sendMessage(
          button.dataset.text
        );

      };

  });

/* =========================
MIC
========================= */

function getVoiceLanguage(){

  const map = {

    fa:"fa-AF",
    en:"en-US",
    fr:"fr-FR",
    ar:"ar-SA",
    de:"de-DE",
    tr:"tr-TR",
    ru:"ru-RU",
    es:"es-ES",
    zh:"zh-CN",
    ja:"ja-JP",
    ko:"ko-KR",
    hi:"hi-IN"

  };

  if(
    selectedLanguage !== "auto" &&
    map[selectedLanguage]
  ){

    return map[selectedLanguage];

  }

  return navigator.language ||
    "fa-AF";

}

function setupMic(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    micBtn.onclick =
      () => alert(
        "مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند."
      );

    return;

  }

  recognition =
    new SR();

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;

  recognition.onstart =
    () => {

      isRecording = true;

      micBtn.classList.add(
        "recording"
      );

      micBtn.textContent =
        "⏹️";

      status.textContent =
        "🎙️ در حال شنیدن...";

    };

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0]
          .transcript;

      input.value =
        transcript;

      input.dispatchEvent(
        new Event("input")
      );

    };

  recognition.onerror =
    error => {

      console.error(
        "Mic error:",
        error
      );

      status.textContent =
        "خطا در میکروفون";

    };

  recognition.onend =
    () => {

      isRecording =
        false;

      micBtn.classList.remove(
        "recording"
      );

      micBtn.textContent =
        "🎙️";

    };

  micBtn.onclick =
    () => {

      recognition.lang =
        getVoiceLanguage();

      if(isRecording){

        recognition.stop();

      }else{

        try{

          recognition.start();

        }catch(error){

          console.error(error);

        }

      }

    };

}

setupMic();

</script>
