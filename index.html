<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta name="theme-color" content="#0b1118">

<title>AfghanAI</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #0b1118;
  color: #ffffff;
  font-family:
    Arial,
    "Noto Sans",
    sans-serif;
  overflow: hidden;
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(
      circle at top,
      #172432 0%,
      #0b1118 45%
    );
}

/* =========================
   HEADER
========================= */

.header {
  height: 64px;
  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 14px;

  background: rgba(10,17,24,.92);

  border-bottom:
    1px solid rgba(255,255,255,.07);

  backdrop-filter: blur(15px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo {
  width: 40px;
  height: 40px;

  border-radius: 13px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      135deg,
      #10b981,
      #087f5b
    );

  font-size: 22px;

  box-shadow:
    0 5px 20px
    rgba(16,185,129,.25);
}

.brandText {
  display: flex;
  flex-direction: column;
}

.brandName {
  font-size: 16px;
  font-weight: 800;
}

.status {
  color: #61d6a8;
  font-size: 11px;
  margin-top: 2px;
}

.headerActions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.iconButton {
  width: 40px;
  height: 40px;

  border: 0;
  border-radius: 12px;

  background: #18222d;
  color: white;

  font-size: 17px;

  cursor: pointer;
}

.iconButton:active {
  transform: scale(.94);
}

/* =========================
   CHAT
========================= */

.chat {
  flex: 1;
  overflow-y: auto;

  padding:
    18px
    12px
    125px;

  scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
  width: 4px;
}

.chat::-webkit-scrollbar-thumb {
  background: #293542;
  border-radius: 20px;
}

/* =========================
   WELCOME
========================= */

.welcome {
  max-width: 600px;
  margin: 35px auto 25px;

  text-align: center;
}

.welcomeLogo {
  width: 72px;
  height: 72px;

  margin: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 24px;

  background:
    linear-gradient(
      135deg,
      #10b981,
      #065f46
    );

  font-size: 38px;

  box-shadow:
    0 15px 45px
    rgba(16,185,129,.22);
}

.welcome h1 {
  margin: 18px 0 8px;

  font-size: 27px;
}

.welcome p {
  margin: 0;

  color: #9ba8b5;

  font-size: 14px;

  line-height: 1.8;
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions {
  max-width: 650px;

  margin:
    15px auto 0;

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 9px;
}

.suggestion {
  min-height: 50px;

  padding: 10px;

  border:
    1px solid
    rgba(255,255,255,.07);

  border-radius: 14px;

  background: #131c25;

  color: #dbe5ed;

  cursor: pointer;

  text-align: center;

  font-size: 12px;

  transition: .2s;
}

.suggestion:hover {
  background: #1b2835;
}

.suggestion:active {
  transform: scale(.97);
}

/* =========================
   MESSAGE
========================= */

.message {
  display: flex;

  margin:
    10px auto;

  max-width: 760px;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn {

  from {
    opacity: 0;
    transform:
      translateY(8px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}

.message.user {
  justify-content: flex-start;
}

.message.assistant {
  justify-content: flex-end;
}

.bubble {
  max-width: 88%;

  padding:
    12px
    14px;

  border-radius: 17px;

  line-height: 1.75;

  font-size: 14px;

  white-space: pre-wrap;

  word-break: break-word;
}

.user .bubble {
  background:
    linear-gradient(
      135deg,
      #087f5b,
      #0b6b4d
    );

  border-bottom-right-radius: 5px;
}

.assistant .bubble {
  background: #151f29;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-bottom-left-radius: 5px;
}

/* =========================
   MESSAGE ACTIONS
========================= */

.messageActions {
  display: flex;

  gap: 5px;

  margin-top: 7px;
}

.messageActions button {
  width: 31px;
  height: 31px;

  border: 0;

  border-radius: 9px;

  background: #202c38;

  color: #c8d3dd;

  cursor: pointer;
}

.messageActions button:active {
  transform: scale(.92);
}

/* =========================
   TYPING
========================= */

.typing {
  display: none;

  max-width: 760px;

  margin: 8px auto;

  color: #8998a6;

  font-size: 12px;
}

.typing.show {
  display: block;
}

.dots span {
  display: inline-block;

  animation:
    blink 1.4s infinite;
}

.dots span:nth-child(2) {
  animation-delay: .2s;
}

.dots span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes blink {

  0%, 80%, 100% {
    opacity: .2;
  }

  40% {
    opacity: 1;
  }

}

/* =========================
   INPUT AREA
========================= */

.inputArea {

  position: fixed;

  bottom: 0;
  left: 0;
  right: 0;

  padding:
    10px
    10px
    calc(10px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      #0b1118 75%,
      rgba(11,17,24,0)
    );

  z-index: 50;
}

.inputBox {

  max-width: 760px;

  margin: auto;

  min-height: 58px;

  display: flex;

  align-items: flex-end;

  gap: 7px;

  padding: 7px;

  background: #151f29;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 18px;

  box-shadow:
    0 10px 40px
    rgba(0,0,0,.35);
}

textarea {

  flex: 1;

  resize: none;

  min-height: 42px;
  max-height: 120px;

  padding:
    11px
    8px;

  border: 0;

  outline: 0;

  background: transparent;

  color: white;

  font-size: 14px;

  line-height: 1.5;

  font-family: inherit;
}

textarea::placeholder {
  color: #758391;
}

.sendButton,
.voiceButton {

  width: 44px;
  height: 44px;

  flex-shrink: 0;

  border: 0;

  border-radius: 13px;

  color: white;

  cursor: pointer;

  font-size: 18px;
}

.sendButton {

  background:
    linear-gradient(
      135deg,
      #10b981,
      #087f5b
    );
}

.voiceButton {

  background: #202c38;
}

.voiceButton.recording {

  background: #dc2626;

  animation:
    pulseVoice 1s infinite;
}

@keyframes pulseVoice {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.08);
  }

  100% {
    transform: scale(1);
  }

}

.sendButton:active,
.voiceButton:active {

  transform: scale(.93);
}

/* =========================
   LANGUAGE PANEL
========================= */

.languagePanel {

  display: none;

  position: fixed;

  top: 65px;
  left: 10px;
  right: 10px;

  max-width: 360px;

  margin-left: auto;

  background: #151f29;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius: 17px;

  padding: 10px;

  z-index: 100;

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.5);
}

.languagePanel.show {
  display: block;
}

.languageTitle {

  padding: 8px;

  color: #8e9ca9;

  font-size: 12px;
}

.languageGrid {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 6px;
}

.languageItem {

  border: 0;

  background: #1d2935;

  color: #e5edf3;

  border-radius: 11px;

  padding: 10px 7px;

  cursor: pointer;

  font-size: 12px;
}

.languageItem.active {

  background: #087f5b;

  color: white;
}

/* =========================
   CLEAR CONFIRM
========================= */

.clearOverlay {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.65);

  z-index: 200;

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.clearOverlay.show {
  display: flex;
}

.clearBox {

  width: 100%;
  max-width: 360px;

  background: #151f29;

  border-radius: 20px;

  padding: 22px;

  text-align: center;
}

.clearBox h3 {

  margin:
    0 0 10px;

}

.clearBox p {

  color: #9ba8b5;

  font-size: 13px;

  line-height: 1.7;
}

.clearButtons {

  display: flex;

  gap: 8px;

  margin-top: 18px;
}

.clearButtons button {

  flex: 1;

  height: 45px;

  border: 0;

  border-radius: 12px;

  cursor: pointer;

  color: white;
}

.cancelButton {
  background: #263441;
}

.confirmButton {
  background: #dc2626;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

  .chat {
    padding:
      12px
      9px
      125px;
  }

  .welcome {
    margin-top: 25px;
  }

  .welcome h1 {
    font-size: 24px;
  }

  .welcomeLogo {
    width: 65px;
    height: 65px;
  }

  .bubble {
    max-width: 92%;
    font-size: 14px;
  }

  .suggestions {
    gap: 7px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        🤖
      </div>

      <div class="brandText">

        <div
          class="brandName"
          id="brandName"
        >
          AfghanAI
        </div>

        <div
          class="status"
          id="statusText"
        >
          آنلاین
        </div>

      </div>

    </div>

    <div class="headerActions">

      <button
        class="iconButton"
        onclick="toggleLanguagePanel()"
        title="Language"
      >
        🌐
      </button>

      <button
        class="iconButton"
        onclick="openClearDialog()"
        title="Clear"
      >
        🗑️
      </button>

    </div>

  </header>


  <!-- LANGUAGE -->

  <div
    class="languagePanel"
    id="languagePanel"
  >

    <div
      class="languageTitle"
      id="languageTitle"
    >
      انتخاب زبان
    </div>

    <div
      class="languageGrid"
      id="languageGrid"
    ></div>

  </div>


  <!-- CHAT -->

  <main
    class="chat"
    id="chat"
  >

    <section
      class="welcome"
      id="welcome"
    >

      <div class="welcomeLogo">
        🤖
      </div>

      <h1 id="welcomeTitle">
        سلام، من AfghanAI هستم
      </h1>

      <p id="welcomeText">
        هر سوالی داری بپرس؛
        می‌توانم در برنامه‌نویسی،
        GitHub، پروژه‌ها و موضوعات مختلف کمکت کنم.
      </p>

      <div
        class="suggestions"
        id="suggestions"
      ></div>

    </section>


    <div
      class="typing"
      id="typing"
    >

      <span id="typingText">
        در حال فکر کردن
      </span>

      <span class="dots">
        <span>.</span>
        <span>.</span>
        <span>.</span>
      </span>

    </div>

  </main>


  <!-- INPUT -->

  <div class="inputArea">

    <div class="inputBox">

      <button
        class="voiceButton"
        id="voiceButton"
        onclick="startVoice()"
        title="Microphone"
      >
        🎤
      </button>

      <textarea
        id="messageInput"
        rows="1"
        autocomplete="off"
        placeholder="پیام خود را بنویسید..."
      ></textarea>

      <button
        class="sendButton"
        id="sendButton"
        onclick="sendMessage()"
        title="Send"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- CLEAR DIALOG -->

<div
  class="clearOverlay"
  id="clearOverlay"
>

  <div class="clearBox">

    <h3 id="clearTitle">
      پاک کردن تاریخچه؟
    </h3>

    <p id="clearText">
      تمام گفتگوهای ذخیره‌شده روی این دستگاه حذف می‌شود.
    </p>

    <div class="clearButtons">

      <button
        class="cancelButton"
        onclick="closeClearDialog()"
        id="cancelButton"
      >
        لغو
      </button>

      <button
        class="confirmButton"
        onclick="clearHistory()"
        id="confirmButton"
      >
        پاک کردن
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL = "/api/chat";

const HISTORY_KEY =
  "afghanai_history_v3";

const LANGUAGE_KEY =
  "afghanai_language_v3";


/* =====================================================
   DOM
===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const voiceButton =
  document.getElementById("voiceButton");

const typing =
  document.getElementById("typing");

const welcome =
  document.getElementById("welcome");

const languagePanel =
  document.getElementById("languagePanel");

const languageGrid =
  document.getElementById("languageGrid");


/* =====================================================
   LANGUAGES
===================================================== */

const LANGUAGES = {

  auto: {
    name: "🌐 Auto",
    native: "Automatic"
  },

  fa: {
    name: "🇦🇫 فارسی",
    native: "فارسی / دری"
  },

  en: {
    name: "🇺🇸 English",
    native: "English"
  },

  fr: {
    name: "🇫🇷 Français",
    native: "Français"
  },

  ar: {
    name: "🇸🇦 العربية",
    native: "العربية"
  },

  de: {
    name: "🇩🇪 Deutsch",
    native: "Deutsch"
  },

  tr: {
    name: "🇹🇷 Türkçe",
    native: "Türkçe"
  },

  ru: {
    name: "🇷🇺 Русский",
    native: "Русский"
  },

  es: {
    name: "🇪🇸 Español",
    native: "Español"
  },

  zh: {
    name: "🇨🇳 中文",
    native: "中文"
  },

  ja: {
    name: "🇯🇵 日本語",
    native: "日本語"
  },

  ko: {
    name: "🇰🇷 한국어",
    native: "한국어"
  },

  hi: {
    name: "🇮🇳 हिन्दी",
    native: "हिन्दी"
  }

};


/* =====================================================
   TRANSLATIONS
===================================================== */

const TEXT = {

  fa: {

    brand: "AfghanAI",
    status: "آنلاین",

    welcome:
      "سلام، من AfghanAI هستم",

    welcomeText:
      "هر سوالی داری بپرس؛ می‌توانم در برنامه‌نویسی، GitHub، پروژه‌ها و موضوعات مختلف کمکت کنم.",

    placeholder:
      "پیام خود را بنویسید...",

    typing:
      "در حال فکر کردن",

    language:
      "انتخاب زبان",

    clear:
      "پاک کردن تاریخچه؟",

    clearText:
      "تمام گفتگوهای ذخیره‌شده روی این دستگاه حذف می‌شود.",

    cancel:
      "لغو",

    confirm:
      "پاک کردن",

    suggestions: [

      "برایم یک سایت بساز",

      "چطور در GitHub پروژه بسازم؟",

      "یک ایده برای درآمد آنلاین بده",

      "کد من را بررسی کن"

    ]

  },


  en: {

    brand: "AfghanAI",
    status: "Online",

    welcome:
      "Hello, I'm AfghanAI",

    welcomeText:
      "Ask me anything. I can help with programming, GitHub, projects and many other topics.",

    placeholder:
      "Write your message...",

    typing:
      "Thinking",

    language:
      "Choose language",

    clear:
      "Clear history?",

    clearText:
      "All saved conversations on this device will be deleted.",

    cancel:
      "Cancel",

    confirm:
      "Clear",

    suggestions: [

      "Build a website for me",

      "How do I create a GitHub project?",

      "Give me an online income idea",

      "Review my code"

    ]

  },


  fr: {

    brand: "AfghanAI",
    status: "En ligne",

    welcome:
      "Bonjour, je suis AfghanAI",

    welcomeText:
      "Posez-moi vos questions. Je peux vous aider avec la programmation, GitHub et vos projets.",

    placeholder:
      "Écrivez votre message...",

    typing:
      "Réflexion",

    language:
      "Choisir la langue",

    clear:
      "Effacer l'historique ?",

    clearText:
      "Toutes les conversations enregistrées sur cet appareil seront supprimées.",

    cancel:
      "Annuler",

    confirm:
      "Effacer",

    suggestions: [

      "Crée-moi un site web",

      "Comment créer un projet GitHub ?",

      "Donne-moi une idée de revenu en ligne",

      "Vérifie mon code"

    ]

  },


  ar: {

    brand: "AfghanAI",
    status: "متصل",

    welcome:
      "مرحباً، أنا AfghanAI",

    welcomeText:
      "اسألني أي شيء. يمكنني مساعدتك في البرمجة وGitHub والمشاريع والعديد من المواضيع.",

    placeholder:
      "اكتب رسالتك...",

    typing:
      "جاري التفكير",

    language:
      "اختر اللغة",

    clear:
      "مسح السجل؟",

    clearText:
      "سيتم حذف جميع المحادثات المحفوظة على هذا الجهاز.",

    cancel:
      "إلغاء",

    confirm:
      "مسح",

    suggestions: [

      "أنشئ لي موقعاً",

      "كيف أنشئ مشروع GitHub؟",

      "أعطني فكرة دخل عبر الإنترنت",

      "راجع الكود الخاص بي"

    ]

  },

};


/* =====================================================
   FALLBACK TRANSLATIONS
===================================================== */

function getTranslationLanguage() {

  const current =
    getUILanguage();

  if (TEXT[current]) {
    return current;
  }

  return "en";
}


function t(key) {

  const lang =
    getTranslationLanguage();

  return TEXT[lang][key]
    || TEXT.en[key]
    || key;
}


/* =====================================================
   LANGUAGE
===================================================== */

let selectedLanguage =
  localStorage.getItem(
    LANGUAGE_KEY
  ) || "fa";


function getUILanguage() {

  if (selectedLanguage === "auto") {

    const browser =
      navigator.language
        .split("-")[0];

    if (LANGUAGES[browser]) {
      return browser;
    }

    return "fa";
  }

  return selectedLanguage;
}


/* =====================================================
   RENDER LANGUAGES
===================================================== */

function renderLanguages() {

  languageGrid.innerHTML = "";

  Object.keys(LANGUAGES)
    .forEach(code => {

      const button =
        document.createElement("button");

      button.className =
        "languageItem";

      if (code === selectedLanguage) {
        button.classList.add("active");
      }

      button.textContent =
        LANGUAGES[code].name;

      button.onclick =
        () => {

          selectedLanguage =
            code;

          localStorage.setItem(
            LANGUAGE_KEY,
            code
          );

          applyLanguage();

          languagePanel
            .classList
            .remove("show");

        };

      languageGrid.appendChild(
        button
      );

    });

}


/* =====================================================
   APPLY LANGUAGE
===================================================== */

function applyLanguage() {

  const lang =
    getUILanguage();

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar" ||
    lang === "fa"
      ? "rtl"
      : "ltr";


  document.getElementById(
    "brandName"
  ).textContent =
    t("brand");


  document.getElementById(
    "statusText"
  ).textContent =
    t("status");


  document.getElementById(
    "welcomeTitle"
  ).textContent =
    t("welcome");


  document.getElementById(
    "welcomeText"
  ).textContent =
    t("welcomeText");


  document.getElementById(
    "languageTitle"
  ).textContent =
    t("language");


  document.getElementById(
    "clearTitle"
  ).textContent =
    t("clear");


  document.getElementById(
    "clearText"
  ).textContent =
    t("clearText");


  document.getElementById(
    "cancelButton"
  ).textContent =
    t("cancel");


  document.getElementById(
    "confirmButton"
  ).textContent =
    t("confirm");


  document.getElementById(
    "typingText"
  ).textContent =
    t("typing");


  input.placeholder =
    t("placeholder");


  renderSuggestions();

  renderLanguages();

}


/* =====================================================
   SUGGESTIONS
===================================================== */

function renderSuggestions() {

  const box =
    document.getElementById(
      "suggestions"
    );

  box.innerHTML = "";

  const list =
    t("suggestions");

  list.forEach(text => {

    const button =
      document.createElement("button");

    button.className =
      "suggestion";

    button.textContent =
      text;

    button.onclick =
      () => {

        input.value =
          text;

        autoResize();

        input.focus();

      };

    box.appendChild(button);

  });

}


/* =====================================================
   HISTORY
===================================================== */

let messages = [];


try {

  messages =
    JSON.parse(
      localStorage.getItem(
        HISTORY_KEY
      ) || "[]"
    );

  if (!Array.isArray(messages)) {
    messages = [];
  }

} catch {

  messages = [];

}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory() {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        messages.slice(-100)
      )
    );

  } catch(error) {

    console.error(
      "History save error:",
      error
    );

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  content,
  save = true
) {

  const message =
    document.createElement("div");

  message.className =
    "message " + role;


  const wrapper =
    document.createElement("div");


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    content;


  wrapper.appendChild(
    bubble
  );


  if (role === "assistant") {

    const actions =
      document.createElement(
        "div"
      );

    actions.className =
      "messageActions";


    const speakButton =
      document.createElement(
        "button"
      );

    speakButton.textContent =
      "🔊";

    speakButton.title =
      "Read";

    speakButton.onclick =
      () => speakText(content);


    const stopButton =
      document.createElement(
        "button"
      );

    stopButton.textContent =
      "⏹️";

    stopButton.title =
      "Stop";

    stopButton.onclick =
      () => stopSpeaking();


    actions.appendChild(
      speakButton
    );

    actions.appendChild(
      stopButton
    );

    wrapper.appendChild(
      actions
    );

  }


  message.appendChild(
    wrapper
  );


  chat.insertBefore(
    message,
    typing
  );


  if (save) {

    messages.push({

      role:
        role === "user"
          ? "user"
          : "assistant",

      content:
        content

    });

    saveHistory();

  }


  scrollToBottom();

}


/* =====================================================
   LOAD HISTORY
===================================================== */

function loadHistory() {

  if (!messages.length) {
    return;
  }

  welcome.style.display =
    "none";


  messages.forEach(message => {

    addMessage(
      message.role,
      message.content,
      false
    );

  });


  scrollToBottom();

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  if (isRecording) {
    stopVoice();
  }


  welcome.style.display =
    "none";


  addMessage(
    "user",
    text,
    true
  );


  input.value = "";

  autoResize();


  setTyping(true);


  sendButton.disabled =
    true;

  voiceButton.disabled =
    true;


  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              messages:
                messages.slice(-20),

              language:
                selectedLanguage

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok ||
        !data.success) {

      throw new Error(
        data.error ||
        "Server error"
      );

    }


    addMessage(
      "assistant",
      data.reply,
      true
    );


    speakText(
      data.reply
    );


  } catch(error) {

    console.error(error);


    addMessage(
      "assistant",
      "❌ " +
      (
        error.message ||
        "خطا در ارتباط با سرور"
      ),
      false
    );

  }


  setTyping(false);


  sendButton.disabled =
    false;

  voiceButton.disabled =
    false;


  input.focus();

}


/* =====================================================
   TYPING
===================================================== */

function setTyping(show) {

  if (show) {

    typing.classList.add(
      "show"
    );

  } else {

    typing.classList.remove(
      "show"
    );

  }

  scrollToBottom();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

  setTimeout(() => {

    chat.scrollTop =
      chat.scrollHeight;

  }, 50);

}


/* =====================================================
   TEXTAREA
===================================================== */

function autoResize() {

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + "px";

}


input.addEventListener(
  "input",
  autoResize
);


/* =====================================================
   ENTER SEND
===================================================== */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   LANGUAGE PANEL
===================================================== */

function toggleLanguagePanel() {

  languagePanel
    .classList
    .toggle("show");

}


document.addEventListener(
  "click",
  function(event) {

    if (
      languagePanel.classList.contains(
        "show"
      ) &&
      !languagePanel.contains(event.target) &&
      !event.target.closest(".iconButton")
    ) {

      languagePanel
        .classList
        .remove("show");

    }

  }
);


/* =====================================================
   CLEAR HISTORY
===================================================== */

function openClearDialog() {

  document
    .getElementById(
      "clearOverlay"
    )
    .classList
    .add("show");

}


function closeClearDialog() {

  document
    .getElementById(
      "clearOverlay"
    )
    .classList
    .remove("show");

}


function clearHistory() {

  messages = [];

  localStorage.removeItem(
    HISTORY_KEY
  );


  document
    .querySelectorAll(
      ".message"
    )
    .forEach(element => {

      element.remove();

    });


  welcome.style.display =
    "block";


  closeClearDialog();

  input.focus();

}


/* =====================================================
   VOICE INPUT
===================================================== */

let recognition = null;

let isRecording = false;


function getVoiceLanguage() {

  const lang =
    getUILanguage();


  const languages = {

    fa: "fa-IR",

    en: "en-US",

    fr: "fr-FR",

    ar: "ar-SA",

    de: "de-DE",

    tr: "tr-TR",

    ru: "ru-RU",

    es: "es-ES",

    zh: "zh-CN",

    ja: "ja-JP",

    ko: "ko-KR",

    hi: "hi-IN"

  };


  return languages[lang]
    || "fa-IR";

}


function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "🎤 تشخیص صدا در این مرورگر پشتیبانی نمی‌شود. لطفاً Chrome را امتحان کنید."
    );

    return;

  }


  if (isRecording) {

    stopVoice();

    return;

  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    getVoiceLanguage();


  recognition.continuous =
    false;


  recognition.interimResults =
    true;


  recognition.onstart =
    function() {

      isRecording =
        true;


      voiceButton
        .classList
        .add("recording");


      voiceButton.textContent =
        "⏹️";

    };


  recognition.onresult =
    function(event) {

      let transcript =
        "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript;

      }


      input.value =
        transcript;


      autoResize();

    };


  recognition.onerror =
    function(event) {

      console.error(
        "Speech recognition error:",
        event.error
      );


      stopVoice();

    };


  recognition.onend =
    function() {

      isRecording =
        false;


      voiceButton
        .classList
        .remove(
          "recording"
        );


      voiceButton.textContent =
        "🎤";

    };


  try {

    recognition.start();

  } catch(error) {

    console.error(error);

  }

}


function stopVoice() {

  if (recognition) {

    try {

      recognition.stop();

    } catch(error) {

      console.log(error);

    }

  }


  isRecording =
    false;


  voiceButton
    .classList
    .remove(
      "recording"
    );


  voiceButton.textContent =
    "🎤";

}


/* =====================================================
   AI VOICE OUTPUT
===================================================== */

function getSpeechLanguage() {

  const lang =
    getUILanguage();


  const languages = {

    fa: "fa-IR",

    en: "en-US",

    fr: "fr-FR",

    ar: "ar-SA",

    de: "de-DE",

    tr: "tr-TR",

    ru: "ru-RU",

    es: "es-ES",

    zh: "zh-CN",

    ja: "ja-JP",

    ko: "ko-KR",

    hi: "hi-IN"

  };


  return languages[lang]
    || "fa-IR";

}


function speakText(text) {

  if (
    !(
      "speechSynthesis"
      in window
    )
  ) {

    return;

  }


  stopSpeaking();


  const cleanText =
    String(text)
      .replace(
        /[*#`_]/g,
        ""
      )
      .trim();


  if (!cleanText) {
    return;
  }


  const speech =
    new SpeechSynthesisUtterance(
      cleanText
    );


  speech.lang =
    getSpeechLanguage();


  speech.rate =
    0.95;


  speech.pitch =
    1;


  window.speechSynthesis
    .speak(
      speech
    );

}


function stopSpeaking() {

  if (
    "speechSynthesis"
    in window
  ) {

    window.speechSynthesis
      .cancel();

  }

}


/* =====================================================
   INITIALIZE
===================================================== */

applyLanguage();

loadHistory();

input.focus();

</script>
