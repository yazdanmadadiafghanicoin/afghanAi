<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>AfghanAI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      background:
        radial-gradient(circle at top, #172554 0, #0b1020 42%, #050814 100%);
      color: #fff;
      min-height: 100vh;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 850px;
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 14px 12px;
      background: rgba(5, 8, 20, .86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 8px 30px rgba(37,99,235,.35);
      font-size: 22px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
    }

    .brand-sub {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 7px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: #fff;
      border-radius: 12px;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: scale(.94);
    }

    .language {
      padding: 0 8px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.05);
      color: white;
      outline: none;
    }

    .language option {
      color: #111;
    }

    #chat {
      flex: 1;
      padding: 18px 14px 145px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      padding: 50px 20px 20px;
    }

    .welcome-icon {
      font-size: 52px;
      margin-bottom: 12px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .welcome p {
      color: #94a3b8;
      margin: 0 auto 24px;
      max-width: 550px;
      line-height: 1.8;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      max-width: 600px;
      margin: auto;
    }

    .suggestion {
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.045);
      color: #e2e8f0;
      border-radius: 15px;
      padding: 13px 10px;
      cursor: pointer;
      text-align: right;
    }

    .suggestion:hover {
      background: rgba(255,255,255,.08);
    }

    .message {
      display: flex;
      margin: 13px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .bubble-wrap {
      max-width: 88%;
    }

    .bubble {
      padding: 13px 15px;
      border-radius: 18px;
      line-height: 1.85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .user .bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-bottom-left-radius: 5px;
    }

    .assistant .bubble {
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.08);
      border-bottom-right-radius: 5px;
    }

    .message-actions {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }

    .assistant .message-actions {
      justify-content: flex-start;
    }

    .user .message-actions {
      justify-content: flex-end;
    }

    .small-btn {
      border: 0;
      background: rgba(255,255,255,.06);
      color: #94a3b8;
      border-radius: 9px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .small-btn:hover {
      color: white;
      background: rgba(255,255,255,.11);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      padding: 13px 15px;
      background: rgba(255,255,255,.07);
      border-radius: 17px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #94a3b8;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-5px);
      }
    }

    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        rgba(5,8,20,1) 65%,
        rgba(5,8,20,.82)
      );
      backdrop-filter: blur(16px);
    }

    .composer-inner {
      max-width: 850px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 7px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 7px;
    }

    #input {
      flex: 1;
      min-height: 42px;
      max-height: 130px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
      line-height: 1.6;
    }

    #input::placeholder {
      color: #64748b;
    }

    .send-btn,
    .mic-btn {
      flex: 0 0 auto;
      width: 43px;
      height: 43px;
      border-radius: 13px;
      border: 0;
      color: white;
      cursor: pointer;
    }

    .send-btn {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }

    .mic-btn {
      background: rgba(255,255,255,.08);
    }

    .mic-btn.recording {
      background: #dc2626;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.08);
      }
    }

    .status {
      text-align: center;
      color: #64748b;
      font-size: 10px;
      margin-top: 6px;
    }

    .error {
      color: #fca5a5;
      background: rgba(127,29,29,.25);
      border: 1px solid rgba(248,113,113,.2);
    }

    @media(max-width: 480px) {
      .suggestions {
        grid-template-columns: 1fr;
      }

      .welcome {
        padding-top: 35px;
      }

      .bubble-wrap {
        max-width: 93%;
      }

      .brand-title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="header-row">

      <div class="brand">
        <div class="logo">🤖</div>
        <div>
          <div class="brand-title">AfghanAI</div>
          <div class="brand-sub" id="brandSub">دستیار هوش مصنوعی</div>
        </div>
      </div>

      <div class="header-actions">
        <select id="language" class="language">
          <option value="auto">🌐 Auto</option>
          <option value="fa">🇦🇫 فارسی</option>
          <option value="en">🇺🇸 English</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="ar">🇸🇦 العربية</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="es">🇪🇸 Español</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="hi">🇮🇳 हिन्दी</option>
        </select>

        <button class="icon-btn" id="clearBtn" title="پاک کردن">🗑️</button>
      </div>

    </div>
  </header>

  <main id="chat">

    <div class="welcome" id="welcome">

      <div class="welcome-icon">🧠</div>

      <h1 id="welcomeTitle">سلام! من AfghanAI هستم</h1>

      <p id="welcomeText">
        دستیار هوش مصنوعی شخصی شما برای برنامه‌نویسی،
        GitHub، پروژه‌ها و سوالات روزمره.
      </p>

      <div class="suggestions">

        <button class="suggestion" data-text="چطور یک سایت حرفه‌ای بسازم؟">
          💻 ساخت سایت
        </button>

        <button class="suggestion" data-text="چطور در GitHub پروژه بسازم؟">
          🐙 GitHub
        </button>

        <button class="suggestion" data-text="برای یادگیری هوش مصنوعی از کجا شروع کنم؟">
          🧠 یادگیری AI
        </button>

        <button class="suggestion" data-text="یک برنامه روزانه برای یادگیری برنامه‌نویسی بساز">
          📅 برنامه روزانه
        </button>

      </div>

    </div>

  </main>

  <div class="composer">

    <div class="composer-inner">

      <button class="mic-btn" id="micBtn" title="میکروفون">
        🎙️
      </button>

      <textarea
        id="input"
        rows="1"
        placeholder="پیام خود را بنویسید..."
      ></textarea>

      <button class="send-btn" id="sendBtn" title="ارسال">
        ➤
      </button>

    </div>

    <div class="status" id="status">
      AfghanAI آماده است
    </div>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   STORAGE
========================================================= */

const HISTORY_KEY = "afghanai_history_v5";
const LANGUAGE_KEY = "afghanai_language_v5";

let messages = [];
let selectedLanguage =
  localStorage.getItem(LANGUAGE_KEY) || "auto";

let currentAudio = null;
let currentSpeakingButton = null;
let recognition = null;
let isRecording = false;

/* =========================================================
   ELEMENTS
========================================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const clearBtn = document.getElementById("clearBtn");
const languageSelect = document.getElementById("language");
const statusEl = document.getElementById("status");
const welcome = document.getElementById("welcome");

languageSelect.value = selectedLanguage;

/* =========================================================
   LANGUAGE
========================================================= */

const UI = {

  fa: {
    title: "سلام! من AfghanAI هستم",
    text: "دستیار هوش مصنوعی شخصی شما برای برنامه‌نویسی، GitHub، پروژه‌ها و سوالات روزمره.",
    placeholder: "پیام خود را بنویسید...",
    status: "AfghanAI آماده است"
  },

  en: {
    title: "Hello! I am AfghanAI",
    text: "Your personal AI assistant for programming, GitHub, projects and everyday questions.",
    placeholder: "Write your message...",
    status: "AfghanAI is ready"
  },

  fr: {
    title: "Bonjour ! Je suis AfghanAI",
    text: "Votre assistant IA personnel pour la programmation, GitHub, vos projets et les questions quotidiennes.",
    placeholder: "Écrivez votre message...",
    status: "AfghanAI est prêt"
  },

  ar: {
    title: "مرحباً! أنا AfghanAI",
    text: "مساعدك الذكي للبرمجة وGitHub والمشاريع والأسئلة اليومية.",
    placeholder: "اكتب رسالتك...",
    status: "AfghanAI جاهز"
  },

  de: {
    title: "Hallo! Ich bin AfghanAI",
    text: "Ihr persönlicher KI-Assistent für Programmierung, GitHub, Projekte und alltägliche Fragen.",
    placeholder: "Nachricht schreiben...",
    status: "AfghanAI ist bereit"
  }
};

function getUILanguage() {
  if (selectedLanguage !== "auto") {
    return selectedLanguage;
  }

  const browser = navigator.language?.slice(0,2);

  return UI[browser] ? browser : "fa";
}

function applyLanguage() {

  const lang = getUILanguage();
  const data = UI[lang] || UI.fa;

  document.documentElement.lang = lang;

  const rtlLanguages = ["fa", "ar"];

  document.documentElement.dir =
    rtlLanguages.includes(lang) ? "rtl" : "ltr";

  document.getElementById("welcomeTitle").textContent =
    data.title;

  document.getElementById("welcomeText").textContent =
    data.text;

  input.placeholder =
    data.placeholder;

  statusEl.textContent =
    data.status;
}

applyLanguage();

/* =========================================================
   LOAD HISTORY
========================================================= */

function loadHistory() {

  try {

    const saved =
      localStorage.getItem(HISTORY_KEY);

    if (!saved) return;

    const parsed = JSON.parse(saved);

    if (!Array.isArray(parsed)) return;

    messages = parsed;

    messages.forEach(message => {

      addMessageToUI(
        message.role,
        message.content,
        false
      );

    });

    if (messages.length > 0) {
      welcome.style.display = "none";
    }

  } catch (error) {

    console.error("History error:", error);

  }

}

loadHistory();

/* =========================================================
   SAVE HISTORY
========================================================= */

function saveHistory() {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(messages.slice(-100))
    );

  } catch (error) {

    console.error("Save history error:", error);

  }

}

/* =========================================================
   MESSAGE UI
========================================================= */

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

function addMessageToUI(
  role,
  content,
  scroll = true
) {

  const message = document.createElement("div");

  message.className =
    "message " + role;

  const wrap =
    document.createElement("div");

  wrap.className = "bubble-wrap";

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML =
    escapeHTML(content);

  wrap.appendChild(bubble);

  if (role === "assistant") {

    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";

    const speak =
      document.createElement("button");

    speak.className = "small-btn";

    speak.textContent = "🔊 پخش صدا";

    speak.onclick = () => {

      speakText(
        content,
        speak
      );

    };

    actions.appendChild(speak);

    wrap.appendChild(actions);

  }

  message.appendChild(wrap);

  chat.appendChild(message);

  if (scroll) {
    scrollToBottom();
  }

  return message;

}

/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom() {

  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}

/* =========================================================
   TYPING
========================================================= */

function showTyping() {

  const message =
    document.createElement("div");

  message.className =
    "message assistant";

  message.id =
    "typingMessage";

  message.innerHTML = `
    <div class="bubble-wrap">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  chat.appendChild(message);

  scrollToBottom();

}

function hideTyping() {

  document
    .getElementById("typingMessage")
    ?.remove();

}

/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(text = null) {

  const value =
    String(
      text !== null
        ? text
        : input.value
    ).trim();

  if (!value) return;

  input.value = "";

  input.style.height = "auto";

  welcome.style.display = "none";

  messages.push({
    role: "user",
    content: value
  });

  addMessageToUI(
    "user",
    value
  );

  saveHistory();

  showTyping();

  sendBtn.disabled = true;

  statusEl.textContent =
    "در حال فکر کردن...";

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          messages:
            messages.slice(-20),

          language:
            selectedLanguage

        })

      });

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "خطا در دریافت پاسخ"
      );

    }

    const reply =
      String(data.reply || "").trim();

    if (!reply) {

      throw new Error(
        "پاسخ خالی دریافت شد"
      );

    }

    messages.push({
      role: "assistant",
      content: reply
    });

    addMessageToUI(
      "assistant",
      reply
    );

    saveHistory();

    statusEl.textContent =
      "AfghanAI آماده است";

    /*
      صدای خودکار پاسخ
    */

    await speakText(reply);

  } catch (error) {

    console.error(error);

    const errorText =
      "❌ " +
      (error.message ||
      "خطا در ارتباط با سرور");

    addMessageToUI(
      "assistant",
      errorText
    );

    statusEl.textContent =
      "خطا";

  } finally {

    hideTyping();

    sendBtn.disabled = false;

    input.focus();

  }

}

/* =========================================================
   GEMINI SERVER TTS
========================================================= */

async function speakText(
  text,
  button = null
) {

  cleanupAudio();

  if (!text) return;

  try {

    statusEl.textContent =
      "🔊 در حال ساخت صدا...";

    if (button) {

      currentSpeakingButton =
        button;

      button.textContent =
        "⏳ در حال آماده‌سازی...";

    }

    const response =
      await fetch("/api/tts", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          text: String(text)
            .slice(0, 5000),

          language:
            selectedLanguage

        })

      });

    if (!response.ok) {

      let errorMessage =
        "خطا در سرویس صدا";

      try {

        const data =
          await response.json();

        if (data.error) {
          errorMessage =
            data.error;
        }

      } catch (_) {}

      throw new Error(
        errorMessage
      );

    }

    const blob =
      await response.blob();

    const url =
      URL.createObjectURL(blob);

    const audio =
      new Audio(url);

    currentAudio =
      audio;

    if (button) {
      button.textContent =
        "⏹️ توقف";
    }

    audio.onended = () => {

      URL.revokeObjectURL(url);

      if (currentSpeakingButton) {

        currentSpeakingButton
          .textContent =
          "🔊 پخش صدا";

      }

      currentSpeakingButton =
        null;

      currentAudio =
        null;

      statusEl.textContent =
        "AfghanAI آماده است";

    };

    audio.onerror = () => {

      URL.revokeObjectURL(url);

      statusEl.textContent =
        "خطا در پخش صدا";

      if (button) {
        button.textContent =
          "🔊 پخش صدا";
      }

      currentSpeakingButton =
        null;

      currentAudio =
        null;

    };

    await audio.play();

    statusEl.textContent =
      "🔊 در حال پخش پاسخ...";

  } catch (error) {

    console.error(
      "TTS ERROR:",
      error
    );

    if (button) {

      button.textContent =
        "🔊 پخش صدا";

    }

    currentSpeakingButton =
      null;

    statusEl.textContent =
      "صدا فعال نشد";

    /*
      اگر ساخت صدا موفق نشد،
      متن همچنان نمایش داده می‌شود.
    */

  }

}

/* =========================================================
   STOP AUDIO
========================================================= */

function cleanupAudio() {

  if (currentAudio) {

    try {
      currentAudio.pause();
    } catch (_) {}

    currentAudio = null;

  }

  if (currentSpeakingButton) {

    currentSpeakingButton.textContent =
      "🔊 پخش صدا";

    currentSpeakingButton =
      null;

  }

}

/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  "click",
  () => sendMessage()
);

/* =========================================================
   ENTER
========================================================= */

input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

/* =========================================================
   AUTO RESIZE
========================================================= */

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);

/* =========================================================
   SUGGESTIONS
========================================================= */

document
  .querySelectorAll(".suggestion")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        sendMessage(
          button.dataset.text
        );

      }
    );

  });

/* =========================================================
   CLEAR
========================================================= */

clearBtn.addEventListener(
  "click",
  () => {

    const ok =
      confirm(
        "آیا تمام تاریخچه چت پاک شود؟"
      );

    if (!ok) return;

    cleanupAudio();

    messages = [];

    localStorage.removeItem(
      HISTORY_KEY
    );

    document
      .querySelectorAll(
        ".message"
      )
      .forEach(el => el.remove());

    welcome.style.display =
      "block";

    statusEl.textContent =
      "AfghanAI آماده است";

  }
);

/* =========================================================
   LANGUAGE CHANGE
========================================================= */

languageSelect.addEventListener(
  "change",
  () => {

    selectedLanguage =
      languageSelect.value;

    localStorage.setItem(
      LANGUAGE_KEY,
      selectedLanguage
    );

    applyLanguage();

  }
);

/* =========================================================
   MICROPHONE
========================================================= */

function setupSpeechRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    micBtn.title =
      "مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند";

    return;

  }

  recognition =
    new SpeechRecognition();

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;

  recognition.lang =
    getVoiceLanguage();

  recognition.onstart = () => {

    isRecording = true;

    micBtn.classList.add(
      "recording"
    );

    micBtn.textContent =
      "⏹️";

    statusEl.textContent =
      "🎙️ در حال شنیدن...";

  };

  recognition.onresult =
    event => {

      const transcript =
        event.results[0][0].transcript;

      input.value =
        transcript;

      input.dispatchEvent(
        new Event("input")
      );

      statusEl.textContent =
        "متن دریافت شد";

    };

  recognition.onerror =
    event => {

      console.error(
        "Speech recognition:",
        event.error
      );

      statusEl.textContent =
        "خطا در میکروفون";

    };

  recognition.onend = () => {

    isRecording = false;

    micBtn.classList.remove(
      "recording"
    );

    micBtn.textContent =
      "🎙️";

  };

}

function getVoiceLanguage() {

  const map = {

    fa: "fa-AF",

    en: "en-US",

    fr: "fr-FR",

    ar: "ar-SA",

    de: "de-DE",

    tr: "tr-TR",

    ru: "ru-RU",

    es: "es-ES",

    zh: "zh-CN",

    ja: "ja-JP",

    ko: "ko-KR",

    hi: "hi-IN"

  };

  if (
    selectedLanguage !== "auto" &&
    map[selectedLanguage]
  ) {

    return map[selectedLanguage];

  }

  const browser =
    navigator.language ||
    "fa-AF";

  return browser;

}

micBtn.addEventListener(
  "click",
  () => {

    if (!recognition) {

      setupSpeechRecognition();

    }

    if (!recognition) {

      alert(
        "مرورگر شما از میکروفون پشتیبانی نمی‌کند."
      );

      return;

    }

    recognition.lang =
      getVoiceLanguage();

    if (isRecording) {

      recognition.stop();

    } else {

      try {

        recognition.start();

      } catch (error) {

        console.error(error);

      }

    }

  }
);

setupSpeechRecognition();

/* =========================================================
   INITIAL FOCUS
========================================================= */

input.focus();

</script>
