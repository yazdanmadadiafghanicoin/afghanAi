<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AfghanAI</title>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family:
        Tahoma,
        Arial,
        "Noto Sans",
        sans-serif;

      background: #0b0f14;
      color: #ffffff;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100vh;
      max-width: 950px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #0b0f14;
    }

    /* HEADER */

    header {
      height: 68px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 14px;

      background: #11161d;
      border-bottom: 1px solid #202731;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 43px;
      height: 43px;
      flex-shrink: 0;

      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #2563eb;

      font-size: 20px;
      font-weight: bold;
    }

    .brandText {
      min-width: 0;
    }

    .brandText strong {
      display: block;
      font-size: 16px;
    }

    .brandText span {
      display: block;
      margin-top: 3px;

      color: #8b97a8;
      font-size: 11px;
    }

    .headerButtons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .iconButton {
      border: 0;
      outline: none;

      background: #1b222c;
      color: white;

      min-width: 40px;
      height: 38px;

      border-radius: 10px;

      cursor: pointer;
    }

    .iconButton:active {
      transform: scale(.95);
    }

    /* CHAT */

    #chat {
      flex: 1;

      overflow-y: auto;

      padding: 20px 15px 125px;

      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #29313c;
      border-radius: 10px;
    }

    .welcome {
      text-align: center;
      margin-top: 55px;
      color: #a8b2c0;
    }

    .welcomeIcon {
      width: 75px;
      height: 75px;

      margin: auto;

      border-radius: 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #2563eb;

      font-size: 34px;

      box-shadow:
        0 10px 35px rgba(37, 99, 235, .22);
    }

    .welcome h2 {
      margin: 16px 0 7px;
      color: white;
      font-size: 21px;
    }

    .welcome p {
      margin: 0 auto;
      max-width: 500px;

      line-height: 1.9;
      font-size: 13px;
    }

    .suggestions {
      margin: 25px auto 0;

      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 9px;

      max-width: 500px;
    }

    .suggestion {
      border: 1px solid #29313c;

      background: #151b23;
      color: #dce3ec;

      padding: 12px 10px;

      border-radius: 13px;

      cursor: pointer;

      font-size: 12px;
    }

    .suggestion:hover {
      background: #1b2430;
    }

    /* MESSAGES */

    .message {
      display: flex;
      margin: 13px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.assistant {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 88%;

      padding: 12px 15px;

      border-radius: 18px;

      font-size: 14px;
      line-height: 1.9;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #2563eb;

      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #1b222c;

      border: 1px solid #29313c;

      border-bottom-left-radius: 5px;
    }

    /* TYPING */

    .typing {
      display: none;

      padding:
        4px 15px 9px;

      color: #8c98a8;

      font-size: 12px;
    }

    .typing.active {
      display: block;
    }

    /* BOTTOM */

    .bottom {
      position: fixed;

      bottom: 0;
      left: 50%;

      transform: translateX(-50%);

      width: min(950px, 100%);

      padding:
        10px 12px 15px;

      background:
        linear-gradient(
          transparent,
          #0b0f14 24%
        );
    }

    .inputBox {
      display: flex;
      align-items: flex-end;
      gap: 8px;

      background: #151b23;

      border: 1px solid #2a333f;

      border-radius: 17px;

      padding: 7px;
    }

    textarea {
      flex: 1;

      resize: none;

      border: 0;
      outline: none;

      background: transparent;
      color: white;

      font-family: inherit;
      font-size: 14px;

      padding:
        9px 10px;

      min-height: 43px;
      max-height: 120px;
    }

    textarea::placeholder {
      color: #788493;
    }

    .sendButton {
      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: 0;

      border-radius: 13px;

      background: #2563eb;

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    .sendButton:disabled {
      opacity: .45;
    }

    /* LANGUAGE PANEL */

    .languagePanel {
      display: none;

      position: fixed;

      top: 73px;
      left: 50%;

      transform: translateX(-50%);

      width: min(360px, calc(100% - 25px));

      background: #151b23;

      border: 1px solid #2b3440;

      border-radius: 16px;

      padding: 12px;

      z-index: 20;

      box-shadow:
        0 15px 50px rgba(0,0,0,.45);
    }

    .languagePanel.active {
      display: block;
    }

    .panelTitle {
      font-size: 13px;

      color: #aab5c3;

      padding: 5px 7px 10px;
    }

    .languageOption {
      width: 100%;

      border: 0;

      background: transparent;

      color: white;

      text-align: start;

      padding: 11px;

      border-radius: 10px;

      cursor: pointer;

      font-family: inherit;
    }

    .languageOption:hover {
      background: #202934;
    }

    .languageOption.selected {
      background: #2563eb;
    }

        font-size: 14px;
      }

      .suggestions {

      }

      .welcome {
        margin-top: 35px;
      }
    }
  </style>

/* =====================================================
   GET UI LANGUAGE
===================================================== */

function getUILanguage() {

  if (selectedLanguage !== "auto") {
    return selectedLanguage;
  }

  const browser =
    navigator.language || "fa";

  const code =
    browser.split("-")[0].toLowerCase();

  if (UI[code]) {
    return code;
  }

  return "fa";
}


/* =====================================================
   UPDATE INTERFACE
===================================================== */

function updateInterface() {

  const lang =
    getUILanguage();

  const t =
    UI[lang];

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    ["fa", "ar"].includes(lang)
      ? "rtl"
      : "ltr";

  document.getElementById(
    "appSubtitle"
  ).textContent =
    t.subtitle;

  document.getElementById(
    "languageTitle"
  ).textContent =
    t.language;

  document.getElementById(
    "typingText"
  ).textContent =
    t.thinking;

  input.placeholder =
    t.placeholder;

  document
    .querySelectorAll(".languageOption")
    .forEach(button => {

      button.classList.toggle(
        "selected",
        button.dataset.language ===
        selectedLanguage
      );

    });

  render();

}


/* =====================================================
   LANGUAGE PANEL
===================================================== */

function toggleLanguagePanel() {

  languagePanel.classList.toggle(
    "active"
  );

}

function selectLanguage(language) {

  selectedLanguage =
    language;

  localStorage.setItem(
    LANGUAGE_KEY,
    language
  );

  languagePanel.classList.remove(
    "active"
  );

  updateInterface();

}


/* =====================================================
   CLOSE PANEL WHEN CLICK OUTSIDE
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    const inside =
      languagePanel.contains(event.target);

    const languageButton =
      event.target.closest(
        ".iconButton"
      );

    if (
      !inside &&
      !languageButton
    ) {

      languagePanel.classList.remove(
        "active"
      );

    }

  }
);


/* =====================================================
   HISTORY
===================================================== */

function loadHistory() {

  try {

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!saved) {
      return [];
    }

    const data =
      JSON.parse(saved);

    return Array.isArray(data)
      ? data
      : [];

  } catch (error) {

    return [];

  }

}


function saveHistory() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(messages)
    );

  } catch (error) {

    console.error(
      "History save error:",
      error
    );

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

}


/* =====================================================
   RENDER
===================================================== */

function render() {

  chat.innerHTML = "";

  const lang =
    getUILanguage();

  const t =
    UI[lang];


  if (messages.length === 0) {

    const suggestions =
      t.suggestions
        .map(text => {

          return `
            <button
              class="suggestion"
              onclick="useSuggestion(this)"
            >
              ${escapeHTML(text)}
            </button>
          `;

        })
        .join("");


    chat.innerHTML = `

      <div class="welcome">

        <div class="welcomeIcon">
          🤖
        </div>

        <h2>
          ${escapeHTML(t.welcomeTitle)}
        </h2>

        <p>
          ${escapeHTML(t.welcomeText)}
        </p>

        <div class="suggestions">
          ${suggestions}
        </div>

      </div>

    `;

    return;
  }


  messages.forEach(message => {

    const wrapper =
      document.createElement("div");

    wrapper.className =
      "message " +
      (
        message.role === "user"
          ? "user"
          : "assistant"
      );


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.innerHTML =
      escapeHTML(
        message.content
      );


    wrapper.appendChild(
      bubble
    );

    chat.appendChild(
      wrapper
    );

  });


  scrollToBottom();

}


function useSuggestion(button) {

  input.value =
    button.textContent.trim();

  input.focus();

  sendMessage();

}


/* =====================================================
   SCROLL
===================================================== */

function scrollToBottom() {

  setTimeout(() => {

    chat.scrollTop =
      chat.scrollHeight;

  }, 50);

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();


  if (!text) {
    return;
  }


  if (sendButton.disabled) {
    return;
  }


  messages.push({

    role: "user",

    content: text

  });


  saveHistory();

  render();


  input.value = "";

  input.style.height =
    "auto";


  sendButton.disabled =
    true;

  typing.classList.add(
    "active"
  );


  scrollToBottom();


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              messages:
                messages.slice(-20),

              language:
                selectedLanguage

            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.success
    ) {

      throw new Error(
        data.error ||
        "AI error"
      );

    }


    messages.push({

      role: "assistant",

      content:
        data.reply

    });


    saveHistory();

    render();


  } catch (error) {

    console.error(error);


    const lang =
      getUILanguage();

    messages.push({

      role: "assistant",

      content:
        UI[lang].error

    });


    saveHistory();

    render();

  } finally {

    sendButton.disabled =
      false;

    typing.classList.remove(
      "active"
    );

    input.focus();

  }

}


/* =====================================================
   CLEAR
===================================================== */

function clearHistory() {

  const lang =
    getUILanguage();

  const confirmed =
    confirm(
      UI[lang].clearConfirm
    );


  if (!confirmed) {
    return;
  }


  messages = [];

  localStorage.removeItem(
    STORAGE_KEY
  );

  render();

}


/* =====================================================
   ENTER TO SEND
===================================================== */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   AUTO RESIZE
===================================================== */

input.addEventListener(
  "input",
  function() {

    this.style.height =
      "auto";

    this.style.height =
      Math.min(
        this.scrollHeight,
        120
      ) + "px";

  }
);


/* =====================================================
   START
===================================================== */

updateInterface();

</script>

</body>
</html>
