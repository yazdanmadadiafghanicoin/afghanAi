<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>AfghanAI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #050b14;
      color: #f5f7fa;
      font-family: Tahoma, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      max-width: 700px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: #08111d;
    }

    header {
      padding: 13px 14px;
      background: #0b1726;
      border-bottom: 1px solid #1c2b3c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      background: linear-gradient(135deg,#19c37d,#087f5b);
      box-shadow: 0 5px 20px rgba(25,195,125,.2);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
    }

    .brand small {
      color: #8291a5;
      font-size: 11px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    select,
    button {
      border: 0;
      outline: 0;
      font-family: inherit;
    }

    select {
      background: #142235;
      color: white;
      border: 1px solid #26384d;
      padding: 8px 7px;
      border-radius: 9px;
      font-size: 11px;
    }

    .clear-btn {
      background: #182538;
      color: #c7d1dd;
      padding: 9px;
      border-radius: 9px;
      cursor: pointer;
    }

    .search-bar {
      padding: 9px 12px;
      background: #091522;
      border-bottom: 1px solid #172638;
    }

    .web-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px;
      border-radius: 10px;
      background: #10382e;
      color: #43e6a4;
      border: 1px solid #176148;
      cursor: pointer;
      font-size: 12px;
    }

    .web-toggle.off {
      background: #172130;
      color: #8291a5;
      border-color: #293648;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px 12px 10px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 25px 15px;
      color: #8998ab;
    }

    .welcome-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .welcome h2 {
      color: #e9eef5;
      margin: 5px 0;
      font-size: 21px;
    }

    .welcome p {
      font-size: 13px;
      line-height: 1.8;
    }

    .suggestions {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .suggestion {
      background: #101d2d;
      border: 1px solid #213249;
      color: #d9e1eb;
      border-radius: 12px;
      padding: 11px;
      cursor: pointer;
      text-align: right;
      font-size: 12px;
    }

    .message {
      display: flex;
      margin: 9px 0;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 88%;
      padding: 11px 13px;
      border-radius: 15px;
      line-height: 1.8;
      font-size: 13px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: #155e75;
      border-bottom-left-radius: 5px;
    }

    .ai .bubble {
      background: #142235;
      border: 1px solid #21354b;
      border-bottom-right-radius: 5px;
    }

    .loading {
      opacity: .7;
    }

    .sources {
      max-width: 88%;
      margin-top: 6px;
      background: #0d1825;
      border: 1px solid #1e3147;
      border-radius: 12px;
      padding: 9px;
    }

    .sources-title {
      font-size: 11px;
      color: #43e6a4;
      margin-bottom: 7px;
    }

    .source {
      display: block;
      text-decoration: none;
      color: #9dc7ff;
      border-top: 1px solid #19293b;
      padding: 7px 2px;
      font-size: 11px;
      line-height: 1.6;
    }

    .source:first-of-type {
      border-top: 0;
    }

    .source small {
      display: block;
      color: #718196;
      margin-top: 2px;
    }

    .copy {
      margin-top: 7px;
      background: #0d1928;
      color: #8192a7;
      border: 1px solid #1e2e42;
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 10px;
      cursor: pointer;
    }

    .composer {
      padding: 9px;
      background: #0b1726;
      border-top: 1px solid #1c2b3c;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 45px;
      max-height: 120px;
      border: 1px solid #26384d;
      background: #101d2d;
      color: white;
      border-radius: 13px;
      padding: 12px;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      direction: rtl;
    }

    textarea:focus {
      border-color: #19c37d;
    }

    .icon-btn {
      width: 45px;
      height: 45px;
      border-radius: 13px;
      background: #142235;
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send {
      background: #19c37d;
      color: #04140d;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #66788e;
      font-size: 9px;
      padding-top: 5px;
    }

    @media(max-width:420px) {
      .brand h1 {
        font-size: 16px;
      }

      .bubble,
      .sources {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>AfghanAI</h1>
        <small>هوش مصنوعی چندزبانه</small>
      </div>
    </div>

    <div class="header-actions">
      <select id="language">
        <option value="auto">خودکار</option>
        <option value="fa">فارسی</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
        <option value="de">Deutsch</option>
        <option value="tr">Türkçe</option>
        <option value="ru">Русский</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="hi">हिन्दी</option>
      </select>

      <button class="clear-btn" onclick="clearHistory()">🗑</button>
    </div>
  </header>

  <div class="search-bar">
    <button id="webToggle" class="web-toggle" onclick="toggleWeb()">
      🌐 جستجوی اینترنت: فعال
    </button>
  </div>

  <main id="chat"></main>

  <div class="composer">

    <div class="input-row">

      <button id="micBtn" class="icon-btn" onclick="startVoice()">
        🎤
      </button>

      <textarea
        id="input"
        placeholder="پیام خود را بنویسید..."
        rows="1"
      ></textarea>

      <button class="icon-btn send" onclick="sendMessage()">
        ➤
      </button>

    </div>

    <div class="status" id="status">
      AfghanAI آماده است
    </div>

  </div>

</div>

<script>

const API_CHAT = "/api/chat";
const API_SEARCH = "/api/search";

const HISTORY_KEY = "afghanai_history_v7";

let messages = [];
let webSearch = true;
let selectedLanguage = localStorage.getItem("afghanai_language") || "auto";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const language = document.getElementById("language");
const statusEl = document.getElementById("status");
const webToggle = document.getElementById("webToggle");

language.value = selectedLanguage;

language.addEventListener("change", () => {
  selectedLanguage = language.value;
  localStorage.setItem("afghanai_language", selectedLanguage);
});

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showWelcome() {

  if (messages.length > 0) return;

  chat.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>AfghanAI</h2>
      <p>
        هوش مصنوعی چندزبانه با قابلیت جستجوی اینترنت.
        <br>
        می‌توانی درباره خبرها، بازار، برنامه‌نویسی و موضوعات مختلف سؤال کنی.
      </p>

      <div class="suggestions">

        <button class="suggestion"
          onclick="useSuggestion('قیمت بیت کوین امروز چیست؟')">
          ₿ قیمت بیت کوین امروز چیست؟
        </button>

        <button class="suggestion"
          onclick="useSuggestion('آخرین خبرهای بازار کریپتو چیست؟')">
          📰 آخرین خبرهای بازار کریپتو
        </button>

        <button class="suggestion"
          onclick="useSuggestion('آخرین اخبار تکنولوژی چیست؟')">
          💻 آخرین اخبار تکنولوژی
        </button>

        <button class="suggestion"
          onclick="useSuggestion('چطور یک سایت حرفه‌ای بسازم؟')">
          🌐 چطور یک سایت حرفه‌ای بسازم؟
        </button>

      </div>
    </div>
  `;
}

function loadHistory() {

  try {
    const saved = localStorage.getItem(HISTORY_KEY);

    if (saved) {
      messages = JSON.parse(saved);
    }

  } catch(e) {
    messages = [];
  }

  renderMessages();
}

function saveHistory() {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-50)));
}

function renderMessages() {

  chat.innerHTML = "";

  if (!messages.length) {
    showWelcome();
    return;
  }

  messages.forEach((m, index) => {

    if (m.role !== "user" && m.role !== "assistant") return;

    const row = document.createElement("div");

    row.className =
      "message " + (m.role === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = m.content;

    row.appendChild(bubble);
    chat.appendChild(row);

    if (
      m.role === "assistant" &&
      m.sources &&
      m.sources.length
    ) {
      renderSources(m.sources);
    }

    if (m.role === "assistant") {

      const copy = document.createElement("button");

      copy.className = "copy";
      copy.textContent = "📋 کپی";

      copy.onclick = () => {
        navigator.clipboard.writeText(m.content);
        copy.textContent = "✅ کپی شد";
      };

      bubble.appendChild(copy);
    }

  });

  scrollBottom();
}

function renderSources(sources) {

  const box = document.createElement("div");

  box.className = "sources";

  box.innerHTML = `
    <div class="sources-title">
      🌐 منابع اینترنتی
    </div>
  `;

  sources.slice(0, 8).forEach(source => {

    const a = document.createElement("a");

    a.className = "source";
    a.href = source.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    a.innerHTML = `
      ${escapeHtml(source.title || "منبع")}
      <small>
        ${escapeHtml(source.snippet || "")}
      </small>
    `;

    box.appendChild(a);

  });

  chat.appendChild(box);
}

function scrollBottom() {
  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  }, 50);
}

function useSuggestion(text) {
  input.value = text;
  sendMessage();
}

function toggleWeb() {

  webSearch = !webSearch;

  if (webSearch) {

    webToggle.classList.remove("off");

    webToggle.textContent =
      "🌐 جستجوی اینترنت: فعال";

  } else {

    webToggle.classList.add("off");

    webToggle.textContent =
      "🌐 جستجوی اینترنت: خاموش";
  }
}

function setStatus(text) {
  statusEl.textContent = text;
}

async function searchInternet(query) {

  try {

    const response = await fetch(
      API_SEARCH + "?q=" + encodeURIComponent(query),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "Search failed");
    }

    return data.results || [];

  } catch(error) {

    console.error("SEARCH ERROR:", error);

    return [];
  }
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  messages.push({
    role: "user",
    content: text
  });

  renderMessages();
  saveHistory();

  setStatus(
    webSearch
      ? "🌐 در حال جستجوی اینترنت..."
      : "🤖 در حال فکر کردن..."
  );

  let sources = [];
  let webContext = "";

  if (webSearch) {

    sources = await searchInternet(text);

    if (sources.length) {

      webContext = sources.map((item, index) => {

        return `
منبع ${index + 1}
عنوان: ${item.title}
آدرس: ${item.url}
خلاصه: ${item.snippet}
`;

      }).join("\n");

      setStatus("🤖 اطلاعات پیدا شد؛ در حال ساخت پاسخ...");

    } else {

      setStatus(
        "⚠️ نتیجه اینترنت پیدا نشد؛ در حال پاسخ‌گویی..."
      );
    }
  }

  try {

    const response = await fetch(API_CHAT, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        messages: messages.slice(-20),

        language: selectedLanguage,

        webContext: webContext

      })

    });

    const data = await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error || "خطا در ارتباط با سرور"
      );
    }

    messages.push({

      role: "assistant",

      content: data.reply,

      sources: sources

    });

    saveHistory();
    renderMessages();

    setStatus("AfghanAI آماده است");

  } catch(error) {

    console.error(error);

    messages.push({

      role: "assistant",

      content:
        "❌ خطا در ارتباط با سرور.\n\n" +
        error.message

    });

    saveHistory();
    renderMessages();

    setStatus("خطا");

  }
}

function clearHistory() {

  if (!confirm("آیا می‌خواهید تاریخچه گفتگو پاک شود؟")) {
    return;
  }

  messages = [];

  localStorage.removeItem(HISTORY_KEY);

  renderMessages();

  setStatus("تاریخچه پاک شد");
}

input.addEventListener("keydown", function(e) {

  if (e.key === "Enter" && !e.shiftKey) {

    e.preventDefault();

    sendMessage();
  }

});

input.addEventListener("input", function() {

  this.style.height = "auto";

  this.style.height =
    Math.min(this.scrollHeight, 120) + "px";

});

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "مرورگر شما از تشخیص صدا پشتیبانی نمی‌کند."
    );

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang =
    selectedLanguage === "en"
      ? "en-US"
      : selectedLanguage === "fr"
      ? "fr-FR"
      : selectedLanguage === "ar"
      ? "ar-SA"
      : "fa-AF";

  recognition.interimResults = false;
  recognition.continuous = false;

  setStatus("🎤 در حال شنیدن...");

  recognition.onresult = function(event) {

    input.value =
      event.results[0][0].transcript;

    input.dispatchEvent(new Event("input"));

    setStatus("آماده ارسال");

  };

  recognition.onerror = function(event) {

    console.error(event);

    setStatus("خطا در تشخیص صدا");
  };

  recognition.onend = function() {

    if (statusEl.textContent === "🎤 در حال شنیدن...") {
      setStatus("AfghanAI آماده است");
    }

  };

  recognition.start();
}

loadHistory();

</script>

</body>
</html>
